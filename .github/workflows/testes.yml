name: Testes

on:
  push:
  pull_request:

jobs:
  app:
    name: App (tipos, lint, contas e build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tipos
      - run: npm run lint
      - run: npm run testes
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos da Edge Function
        run: deno check supabase/functions/ler-nfce/index.ts
      - name: Build da versão web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-de-exemplo

  banco:
    name: Banco (migrações e regras)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: ./supabase/testes/rodar.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
